<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">

        <title>TruthLens</title>

        <link rel = "stylesheet" href = "popup.css">
        <script src = "popup.js" defer></script> 
    </head>
    <body>
        <main class = "popup">
            <header class = "header">
                <h1>TruthLens</h1>
                <p>Hardware reality check</p>
            </header>

            <section class = "status">
                <h2>No hardware detected</h2>
                <div id = "model-picker" class = "model-picker" hidden>
                    <label for = "model-select">Choose a detected model</label>
                    <select id = "model-select" aria-controls = "hardware-summary benchmark-results"></select>
                </div>

                <p id = "hardware-summary">
                    Visit a supported product page to see real benchmark data.
                </p>
            </section>
        </main>
    </body>

</html>
